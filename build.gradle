plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // Shadow プラグイン
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

configurations {
    shadow
    implementation.extendsFrom shadow
}

repositories {
    maven {
        name "JEI"
        url "https://dvs1.progwml6.com/files/maven"
    }
    maven {
        name "ModMaven"
        url "https://modmaven.dev"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Byte Buddy Agent を MODに同梱します
    shadow 'net.bytebuddy:byte-buddy-agent:1.18.8'

    implementation fg.deobf("curse.maven:spark-361579:4738952")
    implementation fg.deobf("curse.maven:appleskin-248787:4770828")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("curse.maven:jade-324717:5672013")
    implementation fg.deobf("curse.maven:modular-routers-250294:5056687")
    implementation fg.deobf("curse.maven:no-sugar-1476611:8000478")
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    implementation fg.deobf("curse.maven:mekanism-268560:6552911")
    implementation fg.deobf("curse.maven:embeddium-908741:5681725")
    implementation fg.deobf("curse.maven:get-it-together-drops-411045:4578649")
    implementation fg.deobf("curse.maven:cloth-config-348521:5729105")
    implementation fg.deobf("curse.maven:jei-integration-265917:4999754")
    implementation fg.deobf("curse.maven:catalogue-459701:4766090")
    implementation fg.deobf("curse.maven:better-combat-by-daedelus-639842:7287334")
    implementation fg.deobf("curse.maven:playeranimator-658587:4587214")
    implementation fg.deobf("curse.maven:imds-reborn-1008701:8538912")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 1. エージェントクラス（DecayAgent, DecayBytecodeBridge）だけを固めた最小JARを作成します
task agentJar(type: Jar) {
    archiveClassifier = 'agent'
    from compileJava.destinationDirectory
    include 'com/maxwell/hyperdamagelib/agent/**'

    manifest {
        attributes(
                'Manifest-Version': '1.0',
                'Premain-Class': 'com.maxwell.hyperdamagelib.agent.DecayAgent',
                'Agent-Class': 'com.maxwell.hyperdamagelib.agent.DecayAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn agentJar // エージェントJARのコンパイル完了を待つ

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // 2. 作成した最小エージェントJARを製品版の META-INF/jarjar に同梱
    from(agentJar) {
        into 'META-INF/jarjar'
        rename { 'decay-agent.jar' }
    }
}

// 生の JAR は一時ファイルとします
tasks.named('jar', Jar).configure {
    archiveClassifier = 'raw'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// 3. ShadowJARの設定（ByteBuddyを同梱・改名）
shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shadow]
    relocate 'net.bytebuddy.agent', 'com.maxwell.hyperdamagelib.shadow.bytebuddy.agent'
    exclude 'META-INF/maven/**'
    exclude 'LICENSE'
}

reobf {
    shadowJar {}
}

tasks.named('shadowJar').configure {
    finalizedBy 'reobfShadowJar'
}

// 開発環境（IDE）で ModuleClassLoader が Byte Buddy を読み込めるように、
// コンパイルの直後に shadow 構成の JAR を解凍して、コンパイル出力フォルダに直接展開します。
compileJava.doLast {
    configurations.shadow.each { file ->
        copy {
            from zipTree(file)
            into compileJava.destinationDirectory
            exclude 'META-INF/**'
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact shadowJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}